<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NRO HORIZON">
    <title>NRO HORIZON</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="app-icon.png">
    <link rel="stylesheet" href="style.css?v=13">
  </head>
  <body>
    <main id="game-shell">
      <canvas id="unity-canvas" width="1024" height="600" tabindex="-1"></canvas>

      <section id="loading" aria-live="polite">
        <div class="loading-glow"></div>
        <div class="loading-content">
          <img class="loading-media" src="loading.gif?v=20260803-loading-once" alt="" aria-hidden="true">
          <div class="progress-track">
            <div id="progress-value"></div>
          </div>
          <div id="loading-label">Đang tải dữ liệu… 0%</div>
        </div>
      </section>

      <section id="unity-warning" aria-live="assertive"></section>
      <section id="runtime-error" class="is-hidden" role="alert"></section>

      <section id="portrait-lock">
        <div class="phone">↻</div>
        <div>Hãy xoay ngang điện thoại để chơi</div>
      </section>
    </main>
    <div id="webgl-input-layer" aria-hidden="true"></div>
    <script>
      // These handlers only deter casual copying. They are not a security boundary:
      // anything delivered to a browser can still be inspected by a determined user.
      (function installCopyDeterrents() {
        document.addEventListener('contextmenu', function (event) {
          event.preventDefault();
        }, true);
        document.addEventListener('dragstart', function (event) {
          event.preventDefault();
        }, true);
        document.addEventListener('keydown', function (event) {
          var key = String(event.key || '').toLowerCase();
          var inspectShortcut = event.ctrlKey && event.shiftKey &&
            ['i', 'j', 'c'].indexOf(key) !== -1;
          var blocked = event.key === 'F12' || inspectShortcut ||
            (event.ctrlKey && key === 'u');
          if (blocked) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      }());

      var shell = document.querySelector('#game-shell');
      var canvas = document.querySelector('#unity-canvas');
      var loading = document.querySelector('#loading');
      var progressValue = document.querySelector('#progress-value');
      var loadingLabel = document.querySelector('#loading-label');
      var warningBanner = document.querySelector('#unity-warning');
      var runtimeError = document.querySelector('#runtime-error');
      var mobileBrowser =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var unityInstance = null;
      var backgroundAudioContext = null;
      var backgroundAudioOscillator = null;
      var viewportSyncFrame = 0;
      var lastViewportWidth = 0;
      var lastViewportHeight = 0;
      var nativeInputActive = false;
      var nativeInputSession = 0;
      var gpuSafeMode = new URLSearchParams(window.location.search).get('gpuSafe') === '1';
      document.documentElement.classList.add(mobileBrowser ? 'mobile' : 'desktop');

      if (typeof window.caches === 'undefined') {
        window.caches = {
          open: function () {
            return Promise.resolve({
              match: function () { return Promise.resolve(undefined); },
              put: function () { return Promise.resolve(); },
              delete: function () { return Promise.resolve(false); },
              keys: function () { return Promise.resolve([]); }
            });
          },
          has: function () { return Promise.resolve(false); },
          delete: function () { return Promise.resolve(false); },
          keys: function () { return Promise.resolve([]); },
          match: function () { return Promise.resolve(undefined); }
        };
      }

      function isIgnorableBrowserError(message) {
        var text = String(message || '');
        var firstLine = text.trim().split(/\r?\n/, 1)[0];
        return mobileBrowser &&
          /^(TypeError:\s*)?Permissions check failed\.?$/i.test(firstLine);
      }

      function setRuntimeError(message) {
        var text = String(message || 'Lỗi không xác định');
        if (isIgnorableBrowserError(text)) {
          return;
        }
        runtimeError.textContent = text.split('\n').slice(0, 20).join('\n');
        runtimeError.classList.remove('is-hidden');
      }

      function unityShowBanner(message, type) {
        if (type === 'error') {
          setRuntimeError(message);
        }

        var item = document.createElement('div');
        item.className = 'warning ' + (type || 'warning');
        item.textContent = message;
        warningBanner.appendChild(item);
        warningBanner.style.display = 'block';

        if (type !== 'error') {
          setTimeout(function () {
            item.remove();
            if (!warningBanner.children.length) {
              warningBanner.style.display = 'none';
            }
          }, 5000);
        }
      }

      function resumeWebAudio() {
        var contexts = [];
        if (backgroundAudioContext) {
          contexts.push(backgroundAudioContext);
        }
        contexts.forEach(function (context) {
          if (context && context.state === 'suspended') {
            context.resume().catch(function () {});
          }
        });
      }

      function enableMobileBackgroundAudio() {
        if (!mobileBrowser || backgroundAudioContext) {
          resumeWebAudio();
          return;
        }

        try {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) {
            return;
          }
          backgroundAudioContext = new AudioContextClass();
          backgroundAudioOscillator = backgroundAudioContext.createOscillator();
          var gain = backgroundAudioContext.createGain();
          gain.gain.value = 0;
          backgroundAudioOscillator.connect(gain);
          gain.connect(backgroundAudioContext.destination);
          backgroundAudioOscillator.start();
          resumeWebAudio();
        } catch (error) {
          backgroundAudioContext = null;
          backgroundAudioOscillator = null;
        }
      }

      function lockLandscape() {
        if (!mobileBrowser || !screen.orientation || !screen.orientation.lock) {
          return;
        }

        var lock = screen.orientation.lock('landscape');
        if (lock && lock.catch) {
          lock.catch(function () {});
        }
      }

      function enterMobileImmersiveMode() {
        if (!mobileBrowser) {
          return;
        }

        var standalone =
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches;

        if (standalone || document.fullscreenElement) {
          lockLandscape();
          return;
        }

        var requestFullscreen =
          document.documentElement.requestFullscreen ||
          document.documentElement.webkitRequestFullscreen;

        if (!requestFullscreen) {
          lockLandscape();
          return;
        }

        try {
          var request = requestFullscreen.call(document.documentElement);
          if (request && request.then) {
            request.then(lockLandscape).catch(function () {
              lockLandscape();
            });
          } else {
            lockLandscape();
          }
        } catch (error) {
          lockLandscape();
        }
      }

      function focusGame() {
        try {
          window.focus();
          canvas.focus({ preventScroll: true });
        } catch (error) {
          canvas.focus();
        }
      }

      function applyMobileViewport() {
        if (!mobileBrowser || nativeInputActive) {
          return;
        }

        var viewport = window.visualViewport;
        var width = Math.max(1, Math.floor(viewport ? viewport.width : window.innerWidth));
        var height = Math.max(1, Math.floor(viewport ? viewport.height : window.innerHeight));
        if (width === lastViewportWidth && height === lastViewportHeight) {
          return;
        }
        lastViewportWidth = width;
        lastViewportHeight = height;
        shell.style.width = width + 'px';
        shell.style.height = height + 'px';
      }

      function syncMobileViewport() {
        if (!mobileBrowser || viewportSyncFrame) {
          return;
        }
        viewportSyncFrame = window.requestAnimationFrame(function () {
          viewportSyncFrame = 0;
          applyMobileViewport();
        });
      }

      function applyDesktopViewport() {
        if (mobileBrowser) {
          return;
        }
        var availableWidth = Math.max(1, window.innerWidth);
        var availableHeight = Math.max(1, window.innerHeight);
        var scale = Math.min(1, availableWidth / 1024, availableHeight / 600);
        shell.style.setProperty('--desktop-scale', scale.toFixed(4));
      }

      function syncGameViewport() {
        if (mobileBrowser) {
          syncMobileViewport();
        } else {
          applyDesktopViewport();
        }
      }

      function calculateSafeDevicePixelRatio() {
        var viewport = window.visualViewport;
        var width = mobileBrowser
          ? (viewport ? viewport.width : window.innerWidth)
          : 1024;
        var height = mobileBrowser
          ? (viewport ? viewport.height : window.innerHeight)
          : 600;
        width = Math.max(1, width);
        height = Math.max(1, height);

        // Bound the drawing buffer for older mobile and integrated GPUs.
        var requested = Math.max(1, window.devicePixelRatio || 1);
        var ratioCap = gpuSafeMode ? 1 : (mobileBrowser ? 2.25 : 1.25);
        var pixelBudget = gpuSafeMode ? 700000 : (mobileBrowser ? 1600000 : 1000000);
        var dimensionBudget = gpuSafeMode ? 1280 : 2048;
        var pixelRatio = Math.sqrt(pixelBudget / (width * height));
        var dimensionRatio = Math.min(dimensionBudget / width, dimensionBudget / height);
        var safeRatio = Math.min(requested, ratioCap, pixelRatio, dimensionRatio);
        return Math.max(1, Math.floor(safeRatio * 100) / 100);
      }

      function isMobileInputTarget(target) {
        var inputLayer = document.querySelector('#webgl-input-layer');
        return !!(inputLayer && target && inputLayer.contains(target));
      }

      function handleMobileGesture(event) {
        if (isMobileInputTarget(event.target)) {
          return;
        }
        enableMobileBackgroundAudio();
        enterMobileImmersiveMode();
        focusGame();
      }

      function restoreMobileMode() {
        if (!mobileBrowser) {
          return;
        }

        window.scrollTo(0, 0);
        syncMobileViewport();
        resumeWebAudio();
        lockLandscape();
      }

      function beginNativeInput() {
        if (!mobileBrowser) {
          return;
        }

        nativeInputSession++;
        nativeInputActive = true;
        document.documentElement.classList.add('native-input-active');
        window.scrollTo(0, 0);
        syncMobileViewport();
        lockLandscape();
      }

      function endNativeInput() {
        if (!mobileBrowser) {
          return;
        }

        var session = nativeInputSession;
        window.scrollTo(0, 0);
        resumeWebAudio();
        lockLandscape();
        window.setTimeout(function () {
          if (session !== nativeInputSession) {
            return;
          }
          nativeInputActive = false;
          document.documentElement.classList.remove('native-input-active');
          lastViewportWidth = 0;
          lastViewportHeight = 0;
          syncMobileViewport();
          lockLandscape();
          focusGame();
        }, 180);
      }

      window.nroBeginNativeInput = beginNativeInput;
      window.nroEndNativeInput = endNativeInput;
      window.nroRestoreMobileMode = restoreMobileMode;

      if (mobileBrowser) {
        window.addEventListener('pointerup', handleMobileGesture, { passive: true });
      }

      window.addEventListener('pageshow', restoreMobileMode);
      document.addEventListener('fullscreenchange', restoreMobileMode);
      document.addEventListener('webkitfullscreenchange', restoreMobileMode);
      window.addEventListener('orientationchange', function () {
        window.setTimeout(function () {
          restoreMobileMode();
        }, 150);
      });
      window.addEventListener('resize', syncGameViewport);
      window.addEventListener('focus', resumeWebAudio);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          restoreMobileMode();
        }
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncMobileViewport);
      }

      var buildUrl = 'Build';
      // Keep every Unity artifact on the same deployment version. This also
      // bypasses stale CDN entries left behind by older WebGL builds.
      var assetVersion = '20260806-mobile-input-sync';
      function versionedAsset(url) {
        return url + '?v=' + encodeURIComponent(assetVersion);
      }
      var loaderUrl = versionedAsset(buildUrl + '/WebGLBuild.loader.js');
      var config = {
        dataUrl: versionedAsset(buildUrl + '/WebGLBuild.data'),
        frameworkUrl: versionedAsset(buildUrl + '/WebGLBuild.framework.js'),
        codeUrl: versionedAsset(buildUrl + '/WebGLBuild.wasm'),
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "CngHownPro",
        productName: "NRO HORIZON",
        productVersion: "1.0",
        autoSyncPersistentDataPath: true,
        // PC always renders in the same 1024x600 coordinate space. Only the
        // CSS shell scales to fit smaller browser viewports.
        matchWebGLToCanvasSize: mobileBrowser,
        devicePixelRatio: mobileBrowser ? calculateSafeDevicePixelRatio() : 1,
        webglContextAttributes: {
          premultipliedAlpha: false,
          preserveDrawingBuffer: false,
          // Let the browser select the stable GPU instead of forcing one.
          powerPreference: 0
        },
        cacheControl: function () {
          return 'no-store';
        },
        showBanner: unityShowBanner
      };

      var contextWasLost = false;
      canvas.addEventListener('webglcontextlost', function (event) {
        event.preventDefault();
        if (contextWasLost) {
          return;
        }
        contextWasLost = true;
        setRuntimeError('GPU đã tạm dừng WebGL. Game đang khởi động lại ở chế độ tương thích…');

        if (!gpuSafeMode) {
          window.setTimeout(function () {
            var recoveryUrl = new URL(window.location.href);
            recoveryUrl.searchParams.set('gpuSafe', '1');
            window.location.replace(recoveryUrl.toString());
          }, 700);
        }
      }, false);

      canvas.addEventListener('webglcontextrestored', function () {
        if (contextWasLost) {
          window.location.reload();
        }
      }, false);


      var loader = document.createElement('script');
      loader.src = loaderUrl;
      loader.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percent = Math.round(progress * 100);
          progressValue.style.width = percent + '%';
          loadingLabel.textContent = 'Đang tải dữ liệu… ' + percent + '%';
        }).then(function (instance) {
          unityInstance = instance;
          window.unityInstance = instance;
          loading.remove();
          syncGameViewport();
          enterMobileImmersiveMode();
          lockLandscape();
          focusGame();
        }).catch(function (message) {
          loadingLabel.textContent = 'Không thể tải dữ liệu';
          setRuntimeError('Không thể khởi động game:\n' + String(message));
        });
      };
      loader.onerror = function () {
        loadingLabel.textContent = 'Không thể tải trình khởi động game';
        setRuntimeError('Không thể tải trình khởi động game');
      };
      document.body.appendChild(loader);

      var originalConsoleError = console.error;
      console.error = function () {
        originalConsoleError.apply(console, arguments);
        var text = Array.prototype.map.call(arguments, function (value) {
          if (value && value.stack) {
            return value.stack;
          }
          return String(value);
        }).join(' ');
        if (/memory access out of bounds|RuntimeError|Exception/i.test(text)) {
          setRuntimeError(text);
        }
      };

      window.addEventListener('error', function (event) {
        if (event.error || event.message) {
          setRuntimeError(event.error && event.error.stack
            ? event.error.stack
            : event.message);
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        if (reason) {
          setRuntimeError(reason.stack || reason);
        }
      });

      canvas.addEventListener('pointerdown', focusGame);
      canvas.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });
      document.addEventListener('keydown', function (event) {
        if (document.activeElement !== canvas) {
          return;
        }
        if (['Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ',
             'PageUp', 'PageDown', 'Home', 'End'].indexOf(event.key) !== -1) {
          event.preventDefault();
        }
      }, { passive: false });

      applyMobileViewport();
      applyDesktopViewport();

      if ('serviceWorker' in navigator &&
          (location.protocol === 'https:' || location.hostname === 'localhost' ||
           location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register(
            versionedAsset('./service-worker.js')
          ).catch(function () {});
        });
      }
    </script>
  </body>
</html>
